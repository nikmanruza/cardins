services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_HOST: 0.0.0.0
      VITE_PORT: 5173
    command: npm run dev -- --host 0.0.0.0 --port 5173
    restart: unless-stopped
